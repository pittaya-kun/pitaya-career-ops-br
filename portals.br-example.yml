# ============================================================
# HOW TO USE
# ============================================================
#
# 1. Copy this file to portals.yml in your career-ops root:
#    cp portals.br-example.yml portals.yml
#
# 2. Edit the tracked_companies list to add/remove companies you care about
#
# 3. Edit title_filter.positive with YOUR target role keywords
#
# 4. For local parsers (Vagas.com, Catho), the scripts are in local/
#    They are gitignored by default so your private company list stays private
#
# 5. Test a provider:
#    node verify-portals.mjs
#
# 6. Run a scan:
#    node scan.mjs --json
#
# 7. For companies with anti-bot (Catho), you may need to:
#    - Login manually in browser
#    - Export cookies
#    - Modify the parser to use cookies
#    - Or use Playwright with persistent context
#
# ============================================================
# NOTES
# ============================================================
#
# - Gupy: Board-wide search via portal.gupy.io API (zero-token, fast)
# - Kenoby/Sólides/Pandapé: ATS providers, auto-detected from *.kenoby.com, *.solides.jobs, *.pandape.com.br
# - Vagas.com/Catho: Local parsers using Playwright (per-company, slower but works)
# - 99jobs/Trampos: Job board providers (try API first, fallback to RSS)
#
# - Local parsers live in local/ (gitignored) - keep your company list private
# - Provider scripts live in providers/ - can be contributed upstream
# - The local/ folder is in .gitignore by default in career-ops
#
# ============================================================